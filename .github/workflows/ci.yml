name: ci

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check src tests scripts ui
          black --check src tests scripts ui
      - name: Tests (synthetic fixture data, no Kaggle download)
        run: pytest -rA

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t next-basket-recommender:ci .
